<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chizgi — aqlli doska</title>
<meta name="description" content="Qo‘lda chizilgan shakllarni avtomatik to‘g‘rilaydigan va bir bosishda 3D ga aylantiradigan virtual doska.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%234f8cff'/><stop offset='1' stop-color='%238b5cf6'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='%230b1020'/><path d='M12 48 L32 14 L52 48 Z' fill='none' stroke='url(%23g)' stroke-width='5' stroke-linejoin='round'/><circle cx='32' cy='36' r='6' fill='url(%23g)'/></svg>">
</head>
<body>
<div id="stage">
  <canvas id="board"></canvas>

  <div class="empty" id="emptyHint">
    <svg viewBox="0 0 120 60" class="empty-art"><path d="M8 50 C 20 10, 40 12, 50 40 S 80 58, 112 12" fill="none" stroke="#4f8cff" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 7" opacity=".7"/><path d="M60 52 L76 22 L92 52 Z" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linejoin="round"/></svg>
    <h1 data-i18n="emptyTitle">Chizishni boshlang</h1>
    <p data-i18n="emptySub">Qo‘lda chizgan shaklingiz shu zahoti to‘g‘rilanadi</p>
  </div>

  <a class="brand" href="./" title="Chizgi">
    <svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M12 48 L32 14 L52 48 Z" fill="none" stroke="url(#lg)" stroke-width="5" stroke-linejoin="round"/><circle cx="32" cy="36" r="6" fill="url(#lg)"/></svg>
    <b>Chizgi</b>
  </a>

  <div class="top-right">
    <select id="lang" aria-label="Til"><option value="uz">UZ</option><option value="ru">RU</option><option value="en">EN</option></select>
    <button id="toggle3d" class="btn3d" data-i18n-title="t_3d"><span class="cube">⬢</span><span data-i18n="to3d">3D</span><i class="pill" id="pill3d">OFF</i></button>
  </div>

  <nav class="dock" id="dock2d">
    <button data-tool="pen" class="active" data-i18n-title="t_pen">✎</button>
    <button data-tool="eraser" data-i18n-title="t_eraser">⌫</button>
    <button data-tool="hand" data-i18n-title="t_hand">✋</button>
    <button id="autoBtn" class="toggle on" data-i18n-title="t_auto">✨</button>
    <span class="sep"></span>
    <div class="swatches" id="swatches"></div>
    <span class="sep"></span>
    <div class="widths" id="widths"></div>
    <span class="sep"></span>
    <button id="undo" data-i18n-title="undo">↶</button>
    <button id="redo" data-i18n-title="redo">↷</button>
    <button id="clear" data-i18n-title="clear">🗑</button>
    <span class="sep"></span>
    <button id="gridBtn" class="toggle" data-i18n-title="grid">#</button>
    <button id="measureBtn" class="toggle" data-i18n-title="measures">📐</button>
    <button id="png" data-i18n-title="export">⤓</button>
  </nav>


  <div class="info3d" id="info3d" hidden></div>
  <div class="toast" id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/i18n.js"></script>
<script src="js/recognize.js"></script>
<script src="js/board.js"></script>
<script src="js/solid3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
